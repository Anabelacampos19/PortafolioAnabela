<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esencia Vital | Catálogo de Jabones (Proyecto de Portafolio)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado / Barra de Navegación -->
    <header>
        <div class="logo">🌿 Esencia Vital</div>
        <!-- Al hacer clic en este botón, se abre/cierra el carrito lateral -->
        <div class="carrito-icono" onclick="alternarCarrito()">
            🛒 <span id="contador-carrito">0</span>
        </div>
    </header>

    <!-- Banner Informativo para Reclutadores -->
    <div class="banner-portafolio">
        <p>🚀 <strong>Proyecto para Portafolio:</strong> Esta es una tienda 100% interactiva de simulación. Puedes elegir cantidades, sumar productos y completar una orden ficticia sin pasarelas de pago reales.</p>
    </div>

    <!-- Contenedor Principal del Catálogo -->
    <main>
        <h1>Nuestro Catálogo Artesanal</h1>
        <!-- JavaScript usará este div para inyectar dinámicamente las tarjetas de jabones -->
        <div id="contenedor-productos" class="cuadrula-productos"></div>
    </main>

    <!-- Panel Lateral del Carrito (Oculto por defecto en CSS) -->
    <aside id="carrito-lateral" class="carrito-lateral">
        <div class="carrito-header">
            <h2>Tu Carrito</h2>
            <button class="btn-cerrar" onclick="alternarCarrito()">✕</button>
        </div>
        
        <!-- Aquí aparecerán los jabones agregados con sus respectivas cantidades -->
        <div id="carrito-items"></div>

        <!-- Resumen de Cuenta y Botón de Checkout Falso -->
        <div class="carrito-total">
            <p>Total: $ <span id="precio-total">0.00</span></p>
            <button id="btn-comprar" onclick="simularCompra()">Finalizar Compra Simulada</button>
        </div>
    </aside>

    <!-- Conexión con la lógica del proyecto -->
    <script src="script.js"></script>
</body>
</html>
